plugins {
    id 'java'
}

group = 'com.backline.test'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-text:1.10.0'
    constraints {
        implementation('org.apache.commons:commons-lang3:3.18.0') {
            because 'CVE-2025-48924 in the 3.12.0 that commons-text 1.10.0 brings in'
        }
    }
}
