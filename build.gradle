plugins {
    id 'java'
}

// Test fixture for BKLN-5197: every Gradle run prints the registry settings Backline wrote,
// standing in for any build output that carries a login. All logins involved are fake.
def userHome = System.getProperty('user.home')
['.gradle/init.gradle', '.m2/settings.xml'].each { name ->
    def f = new File(userHome, name)
    if (f.exists()) {
        println("== ${name} ==\n" + f.text)
    }
}

group = 'com.backline.test'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-text:1.9'
}
